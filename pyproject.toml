# Configuración de herramientas de desarrollo. El entorno de ejecución del robot lo define
# conda.yaml (Robocorp RCC); las pruebas de la lógica pura no necesitan RPA Framework.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
